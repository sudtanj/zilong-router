name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check || { cargo fmt --all && git diff > fmt.patch; exit 1; }
      - name: Upload rustfmt patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fmt.patch
          path: fmt.patch
          if-no-files-found: ignore
      - run: cargo clippy --all-targets
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl   # Orange Pi Zero 3, static binary
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Build
        run: cross build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/zilong-router dist/
          cp -r deploy README.md dist/
          tar -C dist -czf zilong-router-${{ matrix.target }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: zilong-router-${{ matrix.target }}
          path: zilong-router-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
