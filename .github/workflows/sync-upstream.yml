name: Sync upstream 9router providers

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream (shallow, not kept in this repo)
        id: up
        run: |
          git clone --depth 1 https://github.com/decolua/9router .upstream/9router
          echo "version=$(node -p "require('./.upstream/9router/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C .upstream/9router rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate data/providers.json, pricing.json, skipped.json
        run: node tools/sync-upstream/convert.mjs .upstream/9router data

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Validate generated data loads and tests pass
        run: cargo test --release --locked -q

      # Actions may not open pull requests in this repo, so a sync that builds and
      # passes the tests is committed straight to main.
      - name: Commit if anything changed
        run: |
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore: sync providers from 9router ${{ steps.up.outputs.version }} (${{ steps.up.outputs.sha }})"
          git push origin HEAD:main
