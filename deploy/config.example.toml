# Optional config file: mini-router --config /etc/mini-router.toml
# CLI flags and environment variables override these values.
host = "0.0.0.0"
port = 20128
data_dir = "/var/lib/mini-router"
# require_api_key = true
# workers = 2
# log_level = "info"
# connect_timeout_ms = 60000
# stall_timeout_ms = 360000
# outbound_proxy = "socks5://127.0.0.1:1080"

# Dashboard. The session-cookie secret is generated and stored in <data_dir>/jwt-secret
# when unset. The initial password is accepted until one is saved in Settings.
# jwt_secret = "change-me"
# initial_password = "123456"

# Offsite copy on Turso (hosted libSQL). Prefer the TURSO_DATABASE_URL / TURSO_AUTH_TOKEN
# environment variables so the token stays out of this file.
# turso_url = "libsql://mini-router-<org>.turso.io"
# turso_token = "..."
# Keep no database file on disk (SQLite in RAM, Turso is the only durable copy):
# TURSO_ONLY=1 in the environment.
