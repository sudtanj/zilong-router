<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zilong-router</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23E56A4A'/%3E%3Cstop offset='1' stop-color='%23a64027'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23bg)'/%3E%3Cg transform='rotate(45 32 32)'%3E%3Crect x='31' y='24' width='2' height='33' rx='1' fill='%23fff'/%3E%3Crect x='30.2' y='55.5' width='3.6' height='3.5' rx='1' fill='%23fadccf'/%3E%3Cpath d='M30 24.5h4c3 2.5 5 5.5 5.5 9.5-2.5-2-4.5-3-6.5-3.5h-2c-2 .5-4 1.5-6.5 3.5.5-4 2.5-7 5.5-9.5z' fill='%23fadccf'/%3E%3Crect x='28.5' y='21.5' width='7' height='3' rx='1.2' fill='%23fff'/%3E%3Cpath d='M32 5c4 6 4.6 11.5 2.2 16.5h-4.4C27.4 16.5 28 11 32 5z' fill='%23fff'/%3E%3Cpath d='M32 9v11' stroke='%23ee8d6a' stroke-width='1' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script>
// Theme before first paint (same localStorage key semantics as upstream: light | dark | system).
(function(){try{var t=localStorage.getItem('zr-theme')||'system';var m=window.matchMedia('(prefers-color-scheme: dark)').matches;if(t==='dark'||(t==='system'&&m))document.documentElement.classList.add('dark')}catch(e){}})();
// Reveal icons once the symbol font is in, or after 3s so a blocked CDN never hides the UI.
(function(){var r=document.documentElement,f=function(){r.classList.add('fonts-loaded')};if(document.fonts&&document.fonts.load){document.fonts.load('24px "Material Symbols Outlined"').then(f).catch(f);setTimeout(f,3000)}else{f()}})();
</script>
</head>
<body>
<div id="login" class="login hidden">
  <div class="landing-grid"></div>
  <div class="box">
    <div class="login-mark"><svg class="spear" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(45 32 32)"><rect x="31" y="24" width="2" height="33" rx="1" fill="#fff"/><rect x="30.2" y="55.5" width="3.6" height="3.5" rx="1" fill="#fadccf"/><path d="M30 24.5h4c3 2.5 5 5.5 5.5 9.5-2.5-2-4.5-3-6.5-3.5h-2c-2 .5-4 1.5-6.5 3.5.5-4 2.5-7 5.5-9.5z" fill="#fadccf"/><rect x="28.5" y="21.5" width="7" height="3" rx="1.2" fill="#fff"/><path d="M32 5c4 6 4.6 11.5 2.2 16.5h-4.4C27.4 16.5 28 11 32 5z" fill="#fff"/></g></svg></div>
    <h1>zilong-router</h1>
    <p class="lead">Enter your password to access the dashboard</p>
    <div class="card">
      <form id="login-form" class="col gap4">
        <div class="field">
          <label>Password</label>
          <input id="login-password" class="input" type="password" placeholder="Enter password" autocomplete="current-password" required autofocus>
          <p id="login-error" class="xs danger"></p>
        </div>
        <button class="btn primary full" type="submit" id="login-btn">Login</button>
      </form>
    </div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar">
    <div class="traffic"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <a class="logo" href="#/endpoint">
      <div class="tile"><svg class="spear" viewBox="0 0 64 64" aria-hidden="true"><g transform="rotate(45 32 32)"><rect x="31" y="24" width="2" height="33" rx="1" fill="#fff"/><rect x="30.2" y="55.5" width="3.6" height="3.5" rx="1" fill="#fadccf"/><path d="M30 24.5h4c3 2.5 5 5.5 5.5 9.5-2.5-2-4.5-3-6.5-3.5h-2c-2 .5-4 1.5-6.5 3.5.5-4 2.5-7 5.5-9.5z" fill="#fadccf"/><rect x="28.5" y="21.5" width="7" height="3" rx="1.2" fill="#fff"/><path d="M32 5c4 6 4.6 11.5 2.2 16.5h-4.4C27.4 16.5 28 11 32 5z" fill="#fff"/></g></svg></div>
      <div class="col"><h1>zilong-router</h1><span class="ver" id="version"></span></div>
    </a>
    <nav class="nav" id="nav">
      <a href="#/endpoint" data-page="endpoint"><span class="ms i18">api</span><span class="lbl">Endpoint &amp; Key</span></a>
      <a href="#/providers" data-page="providers"><span class="ms i18">dns</span><span class="lbl">Providers</span></a>
      <a href="#/usage" data-page="usage"><span class="ms i18">bar_chart</span><span class="lbl">Usage</span></a>
      <a href="#/token-saver" data-page="token-saver"><span class="ms i18">savings</span><span class="lbl">Token Saver</span></a>
      <div class="section"><p>Debug</p></div>
      <a href="#/console-log" data-page="console-log"><span class="ms i18">terminal</span><span class="lbl">Console Log</span></a>
      <div class="section"><p>System</p></div>
      <a href="#/profile" data-page="profile"><span class="ms i18">settings</span><span class="lbl">Settings</span></a>
      <a href="https://github.com/decolua/9router" target="_blank" rel="noreferrer"><span class="ms i18">open_in_new</span><span class="lbl">9Router upstream</span></a>
    </nav>
    <a class="dbstat hidden" id="dbstat" href="#/profile"></a>
  </aside>

  <main class="main">
    <div class="landing-grid"></div>
    <header class="header">
      <button class="menubtn iconbtn sq" id="menubtn" aria-label="Menu"><span class="ms">menu</span></button>
      <div class="title" id="page-title"></div>
      <div class="actions">
        <div class="search hidden" id="search"><span class="ms i16">search</span><input id="search-input" type="text" placeholder="Search..."></div>
        <button class="donate" data-act="donate" aria-label="Donate"><span class="ms i18">volunteer_activism</span><span class="lbl">Donate</span></button>
        <button class="iconbtn" id="theme-toggle" title="Toggle theme"><span class="ms i22">dark_mode</span></button>
        <div style="position:relative">
          <button class="iconbtn sq" id="menu-toggle" title="Menu"><span class="ms">grid_view</span></button>
          <div class="dropdown hidden" id="menu">
            <button data-act="toggleTheme"><span class="ms i20">dark_mode</span><span>Theme</span></button>
            <button data-act="import9router"><span class="ms i20">move_to_inbox</span><span>Import from 9router</span></button>
            <button data-act="logout" class="danger"><span class="ms i20">logout</span><span>Logout</span></button>
          </div>
        </div>
      </div>
    </header>
    <div class="content"><div class="inner" id="main"></div></div>
  </main>
</div>

<div class="toasts" id="toasts"></div>
<div id="modal-root"></div>

<script src="/assets/app.js"></script>
</body>
</html>
