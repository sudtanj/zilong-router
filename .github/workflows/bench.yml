name: Benchmark

# Memory and latency of the release binary on a native arm64 runner (the Orange Pi Zero 3 is
# aarch64), with 1 worker thread (the Docker image) and 2 (the systemd unit's default). The
# tables land in the job summary and, on main, in the README (between the bench markers);
# see tests/memory_bench.rs for what is measured.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "data/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/memory_bench.rs"
      - ".github/workflows/bench.yml"

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  memory:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-arm64
      - name: Benchmark
        env:
          BENCH_WORKERS: "1,2"
          BENCH_README: ${{ github.workspace }}/README.md
        run: cargo test --release --locked --test memory_bench -- --ignored --nocapture
      - name: Commit README
        if: github.ref == 'refs/heads/main'
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -q -m "docs: benchmark numbers for ${GITHUB_SHA::7}"
          git pull -q --rebase origin main
          git push origin HEAD:main
